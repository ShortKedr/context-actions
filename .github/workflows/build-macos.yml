name: macOS universal build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install media tools
        run: |
          brew install ffmpeg-full qpdf
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Build and test a universal app
        run: |
          cmake -S . -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build/macos
          ctest --test-dir build/macos --output-on-failure
          bash scripts/smoke-test-posix.sh build/macos/ContextActions.app/Contents/MacOS/ContextActions build/macos
      - name: Build app archive and installer
        run: bash packaging/macos/package.sh build/macos dist/macos
      - name: Verify app archive and install package
        run: |
          (cd dist/macos && shasum -a 256 -c ./*.sha256)
          ditto -x -k dist/macos/*.zip build/macos/archive-check
          app=build/macos/archive-check/ContextActions.app
          lipo "$app/Contents/MacOS/ContextActions" -verify_arch arm64 x86_64
          codesign --verify --strict --all-architectures "$app"
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSServices:0:NSMessage' "$plist")" = chooseFileAction
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSServices:0:NSSendFileTypes:0' "$plist")" = public.data
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSServices:0:NSRequiredContext:NSApplicationIdentifier' "$plist")" = com.apple.finder
          sudo installer -pkg dist/macos/*.pkg -target /
          /Applications/ContextActions.app/Contents/MacOS/ContextActions --help
          if sudo installer -pkg dist/macos/*.pkg -target /; then
            echo 'PKG unexpectedly allowed reinstalling the same version.' >&2
            exit 1
          fi
          installed_plist=/Applications/ContextActions.app/Contents/Info.plist
          sudo /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 9999.0.0' "$installed_plist"
          if sudo installer -pkg dist/macos/*.pkg -target /; then
            echo 'PKG unexpectedly allowed a downgrade.' >&2
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$installed_plist")" = '9999.0.0'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ContextActions-macos-universal-app
          path: |
            dist/macos/*.zip
            dist/macos/*.zip.sha256
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ContextActions-macos-universal-installer
          path: |
            dist/macos/*.pkg
            dist/macos/*.pkg.sha256
          compression-level: 0
          if-no-files-found: error

  verify-intel:
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ContextActions-macos-universal-installer
          path: dist/macos
      - name: Install and run the Intel slice
        run: |
          (cd dist/macos && shasum -a 256 -c ./*.sha256)
          sudo installer -pkg dist/macos/*.pkg -target /
          /Applications/ContextActions.app/Contents/MacOS/ContextActions --help
