name: Windows build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Ensure native XAML build tools are installed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $version = '[17.0,18.0)'
          $components = @(
            'Microsoft.VisualStudio.Component.WindowsAppSdkSupport.Cpp',
            'Microsoft.VisualStudio.ComponentGroup.UWP.Support',
            'Microsoft.VisualStudio.ComponentGroup.UWP.VC'
          )
          $ready = & $vswhere -latest -version $version -requires $components -property installationPath
          if (-not $ready) {
            $vs = & $vswhere -latest -version $version -property installationPath
            if (-not $vs) { throw 'Visual Studio 2022 is missing from the runner.' }
            $options = @('modify', '--installPath', ('"{0}"' -f $vs), '--quiet', '--norestart')
            foreach ($component in $components) { $options += @('--add', $component) }
            $setup = Start-Process -FilePath (Join-Path $installer 'setup.exe') -ArgumentList $options -Wait -PassThru -WindowStyle Hidden
            if ($setup.ExitCode -notin 0, 3010) { throw "Visual Studio Installer exited with code $($setup.ExitCode)." }
            $ready = & $vswhere -latest -version $version -requires $components -property installationPath
            if (-not $ready) { throw 'The native XAML build components are missing after setup.' }
          }
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .build-tools/downloads
          key: windows-verified-inputs-${{ hashFiles('dependencies.json', 'src/ui/packages.config', 'scripts/build-ui.ps1') }}
      - name: Build, lightweight tests and installer
        shell: pwsh
        run: ./scripts/build-and-package.ps1 -Release
      - name: Archive the portable app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'dist/ContextActions-win-x64.zip'
          & "$env:SystemRoot/System32/tar.exe" -a -cf $archive -C dist ContextActions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ContextActions-win-x64-app
          path: |
            dist/ContextActions-win-x64.zip
            dist/ContextActions-win-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ContextActions-win-x64
          path: |
            dist/*setup.exe
            dist/*setup.exe.sha256
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ContextActions-win-x64-reports
          path: |
            dist/reports/application-smoke.txt
            dist/reports/build-inputs.json
            dist/reports/components.json
            dist/reports/size.json
            dist/reports/test-status.json
          if-no-files-found: warn
  verify-installer:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ContextActions-win-x64
          path: dist
      - name: Verify the installer on the runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -LiteralPath dist -Filter '*setup.exe'
          $install = Join-Path $PWD 'build/installer-smoke'
          $log = Join-Path $PWD 'dist/reports/installer-smoke.log'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $log) | Out-Null
          $options = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=',
            ('/DIR="{0}"' -f $install), ('/LOG="{0}"' -f $log))
          try {
            $setup = Start-Process -FilePath $installer.FullName -ArgumentList $options -Wait -PassThru -WindowStyle Hidden
            if ($setup.ExitCode -ne 0) {
              throw "The installer exited with code $($setup.ExitCode)."
            }
            ./scripts/smoke-test.ps1 -AppDirectory $install -ReportDirectory dist/reports/installed
            $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{A836FB4F-6548-4FC3-8D67-50267B25A418}_is1'
            $version = Get-ItemPropertyValue -LiteralPath $uninstallKey -Name DisplayVersion
            $exe = Join-Path $install 'ContextActions.exe'
            $hash = (Get-FileHash -LiteralPath $exe).Hash
            try {
              foreach ($installedVersion in @($version, '9999.0.0')) {
                Set-ItemProperty -LiteralPath $uninstallKey -Name DisplayVersion -Value $installedVersion
                $setup = Start-Process -FilePath $installer.FullName -ArgumentList $options -Wait -PassThru -WindowStyle Hidden
                if ($setup.ExitCode -ne 7 -or (Get-FileHash -LiteralPath $exe).Hash -ne $hash) {
                  throw "Setup did not reject installation over version $installedVersion (exit code $($setup.ExitCode))."
                }
              }
            } finally {
              Set-ItemProperty -LiteralPath $uninstallKey -Name DisplayVersion -Value $version
            }
          } finally {
            $uninstaller = Join-Path $install 'unins000.exe'
            if (Test-Path -LiteralPath $uninstaller) {
              $result = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru -WindowStyle Hidden
              if ($result.ExitCode -ne 0) { throw "The uninstaller exited with code $($result.ExitCode)." }
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: Windows-installer-test-reports
          path: dist/reports/installed/application-smoke.txt
          if-no-files-found: warn
