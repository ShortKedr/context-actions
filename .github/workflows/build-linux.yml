name: Linux build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install GTK, media and packaging tools
        timeout-minutes: 6
        run: |
          sources="$RUNNER_TEMP/context-actions-ubuntu.list"
          keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg
          if [[ $(dpkg --print-architecture) == arm64 ]]; then
            archive=https://ports.ubuntu.com/ubuntu-ports
            security=$archive
            mirror=https://mirrors.mit.edu/ubuntu-ports
          else
            archive=https://archive.ubuntu.com/ubuntu
            security=https://security.ubuntu.com/ubuntu
            mirror=https://mirrors.mit.edu/ubuntu
          fi
          export http_proxy="${http_proxy:-${HTTP_PROXY:-}}"
          export https_proxy="${https_proxy:-${HTTPS_PROXY:-}}"
          export no_proxy="${no_proxy:-${NO_PROXY:-}}"
          apt_root=(sudo --preserve-env=http_proxy,https_proxy,no_proxy)
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=1 -o Acquire::https::Timeout=15 -o Acquire::Languages=none)

          install_tools() {
            local archive_url=$1 security_url=$2
            echo "Checking Ubuntu archive at $archive_url"
            curl -fsSL --connect-timeout 8 --max-time 12 -o /dev/null \
              "$archive_url/dists/noble/InRelease" || return
            curl -fsSL --connect-timeout 8 --max-time 12 -o /dev/null \
              "$security_url/dists/noble-security/InRelease" || return
            {
              echo "deb [signed-by=$keyring] $archive_url noble main universe"
              echo "deb [signed-by=$keyring] $archive_url noble-updates main universe"
              echo "deb [signed-by=$keyring] $security_url noble-security main universe"
            } > "$sources" || return
            "${apt_root[@]}" timeout --kill-after=5s 100s apt-get "${apt_options[@]}" \
              update -o APT::Update::Error-Mode=any || return
            "${apt_root[@]}" apt-get "${apt_options[@]}" install -y --no-install-recommends \
              ninja-build libgtk-4-dev ffmpeg qpdf desktop-file-utils dpkg-dev rpm cpio
          }

          if ! install_tools "$archive" "$security" && ! install_tools "$mirror" "$mirror"; then
            echo "::error::Could not install Linux build dependencies from either signed Ubuntu archive."
            exit 1
          fi
      - name: Build and test
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux
          ctest --test-dir build/linux --output-on-failure
          bash scripts/smoke-test-posix.sh build/linux/src/linux/context-actions build/linux
      - name: Build archive, DEB and RPM
        run: |
          cpack --config build/linux/CPackConfig.cmake -B dist/linux -G 'TGZ;DEB;RPM'
          install -m 0755 packaging/linux/ContextActions-linux-installer.sh dist/linux/
          (cd dist/linux && sha256sum ContextActions-linux-installer.sh > ContextActions-linux-installer.sh.sha256)
      - name: Verify packages
        env:
          DEB_ARCH: ${{ matrix.arch }}
        run: |
          (cd dist/linux && sha256sum -c ./*.sha256)
          mkdir -p build/linux/archive-check
          tar -xzf dist/linux/*.tar.gz --strip-components=1 -C build/linux/archive-check
          build/linux/archive-check/usr/bin/context-actions --help
          test "$(dpkg-deb --field dist/linux/*.deb Architecture)" = "$DEB_ARCH"
          sudo apt-get install -y --no-install-recommends "$PWD"/dist/linux/*.deb
          /usr/bin/context-actions --help
          if sudo dpkg -i dist/linux/*.deb; then
            echo 'DEB unexpectedly allowed reinstalling the same version.' >&2
            exit 1
          fi
          test "$(dpkg-query -W -f='${Status}' context-actions)" = 'install ok installed'
          version="$(dpkg-deb --field dist/linux/*.deb Version)"
          sudo env "CONTEXT_ACTIONS_GUI_DOWNGRADE=deb:$version" dpkg -i dist/linux/*.deb
          desktop-file-validate /usr/share/applications/io.github.ShortKedr.ContextActions.desktop
          test "$(rpm -qp --queryformat '%{ARCH}' dist/linux/*.rpm)" = "$(uname -m)"
          rpm -qp --requires dist/linux/*.rpm
          mkdir -p build/linux/rpm-check
          rpm2cpio dist/linux/*.rpm | (cd build/linux/rpm-check && cpio -id)
          build/linux/rpm-check/usr/bin/context-actions --help
          desktop-file-validate build/linux/rpm-check/usr/share/applications/io.github.ShortKedr.ContextActions.desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ContextActions-linux-${{ matrix.arch }}-app
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ContextActions-linux-${{ matrix.arch }}-installers
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/*.deb.sha256
            dist/linux/*.rpm.sha256
            dist/linux/ContextActions-linux-installer.sh
            dist/linux/ContextActions-linux-installer.sh.sha256
          compression-level: 0
          if-no-files-found: error
