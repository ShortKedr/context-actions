name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Verify the tag and package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a release tag in vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          version=${TAG#v}
          test "$(sed -nE 's/^project\(ContextActions VERSION ([^ ]+) .*/\1/p' CMakeLists.txt)" = "$version"
          test "$(jq -r .version dependencies.json)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: validate
    uses: ./.github/workflows/build-windows.yml

  macos:
    needs: validate
    uses: ./.github/workflows/build-macos.yml

  linux:
    needs: validate
    uses: ./.github/workflows/build-linux.yml

  publish:
    needs: [validate, windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ContextActions-*
          path: downloaded
      - name: Verify and collect release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: bash scripts/prepare-release.sh "$VERSION" downloaded release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          verify_tag() {
            local target
            target=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            if [[ $target != "$(git rev-parse HEAD)" ]]; then
              echo "Release tag no longer points to the verified build commit." >&2
              return 1
            fi
          }

          verify_assets() {
            local release_id
            release_id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
            gh api --paginate "repos/$GH_REPO/releases/$release_id/assets" \
              --jq '.[] | select(.state == "uploaded") | [.digest, .name] | join("  ")' > uploaded.txt
            (cd release-assets && sha256sum --binary -- * | sed -E 's/^([[:xdigit:]]+) \*/sha256:\1  /') > expected.txt
            diff -u <(sort expected.txt) <(sort uploaded.txt)
          }

          verify_tag
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ $draft == false ]]; then
              gh release view "$TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | .name' > uploaded.txt
              diff -u <(ls -1 release-assets | sort) <(sort uploaded.txt)
              exit 0
            fi
          else
            previous=''
            published=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName')
            while IFS= read -r candidate; do
              if [[ -n $candidate && $candidate != "$TAG" ]] &&
                  git merge-base --is-ancestor "refs/tags/$candidate" HEAD; then
                previous=$candidate
                break
              fi
            done <<< "$published"
            range=HEAD
            if [[ -n $previous ]]; then
              range="refs/tags/$previous..HEAD"
            fi
            {
              echo '## Downloads'
              echo
              echo '- **Windows 10 22H2 and Windows 11 x64** use the setup EXE or portable ZIP. Setup downloads verified FFmpeg and qpdf archives. The portable app uses FFmpeg, ffprobe, and qpdf from PATH or its engines folder.'
              echo '- **macOS** uses the universal PKG or ZIP on Intel and Apple Silicon. The installer is an unsigned preview. Install the media tools separately with `brew install ffmpeg-full qpdf`.'
              echo '- **Linux** uses DEB or RPM for x86-64 and ARM64, or the pacman package for Arch Linux x86-64. The portable tar archives include a per-user installer for other compatible distributions.'
              echo '- **Linux reinstall and downgrade** uses `ContextActions-linux-installer.sh` to verify a DEB, RPM or Arch package against its GitHub release checksums and confirm the replacement. Requires Zenity, PolicyKit, curl, and GitHub access.'
              echo '- **SHA-256** checksums are in `SHA256SUMS.txt`.'
              echo
              echo '## Changes'
              echo
              git log --no-merges --format='- %s (%h)' "$range"
            } > release-notes.md
            gh release create "$TAG" --verify-tag --draft --title "Context Actions $TAG" --notes-file release-notes.md
          fi

          gh release upload "$TAG" release-assets/* --clobber
          verify_assets
          verify_tag
          gh release edit "$TAG" --verify-tag --draft=false
